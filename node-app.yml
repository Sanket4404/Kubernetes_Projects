apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers: 
        - name: node-app #Run this container
          image: sds04/db-demo-app:04
          env: 
            - name: MONGO_HOST
              valueFrom: 
                configMapKeyRef:
                  name: mongo-congfig
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom: 
                configMapKeyRef:
                  name: mongo-congfig
                  key: MONGO_PORT                  



---



apiVersion: v1
kind: Service
metadata:
  name: service-node-app

spec:
  selector:
    app: node-app

  ports:
    - name: http
      port: 8080
      targetPort: 3000
  selector:
    app: node-app
  type: LoadBalancer

  